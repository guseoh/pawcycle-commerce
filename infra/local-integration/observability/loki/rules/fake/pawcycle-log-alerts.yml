groups:
  - name: pawcycle-local-log-alerts
    rules:
      - alert: PawCycleBackendErrorLogSpike
        expr: sum(count_over_time({service="backend", level="ERROR"}[5m])) > 10
        for: 1m
        labels:
          scope: local
          severity: warning
        annotations:
          summary: Backend ERROR 로그 급증
          description: 최근 5분 동안 backend ERROR 로그가 10건을 넘었다. 같은 원인이 반복되는지 로그에서 확인한다.
          impact: 원인에 따라 다르다. 외부 호출 INTERNAL 실패·스케줄 작업 실패 알림이 함께 왔는지 먼저 본다.
          dashboard: http://127.0.0.1:3001/d/pawcycle-logs/pawcycle-logs?var-service=backend&var-level=ERROR&from=now-1h&to=now
          runbook: https://github.com/guseoh/pawcycle-commerce/blob/main/docs/runbook/OBS-002-local-alert-response.md#pawcyclebackenderrorlogspike
