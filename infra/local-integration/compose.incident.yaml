services:
  mysql:
    volumes:
      - inc-base-001-mysql-data:/var/lib/mysql

  backend:
    environment:
      PAWCYCLE_LOCAL_QA_BOOTSTRAP_RESET_SUBSCRIPTIONS: "false"

  prometheus:
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules:/etc/prometheus/rules:ro
      - inc-base-001-prometheus-data:/prometheus

  grafana:
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - inc-base-001-grafana-data:/var/lib/grafana

volumes:
  inc-base-001-mysql-data:
  inc-base-001-prometheus-data:
  inc-base-001-grafana-data:
