# Per-client limits key on $binary_remote_addr, the TCP peer nginx sees. The
# proxy publishes 80/443 directly on the host, so no X-Forwarded-For value from
# the client is trusted here (no realip module). Rates were confirmed by the user on 2026-11-17;
# see docs/runbook/OPS-OCI-CD-02-release-recovery.md (Edge rate limit).
limit_req_zone $binary_remote_addr zone=login_per_ip:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=csrf_per_ip:2m rate=30r/m;
limit_req_zone $pawcycle_search_limit_key zone=search_per_ip:2m rate=60r/m;
limit_req_zone $binary_remote_addr zone=checkout_per_ip:2m rate=10r/m;
limit_req_zone $binary_remote_addr zone=payment_per_ip:2m rate=10r/m;
limit_req_zone $binary_remote_addr zone=interaction_per_ip:2m rate=120r/m;
limit_req_zone $binary_remote_addr zone=ai_per_ip:2m rate=30r/m;

# Only product list requests that carry a search term (q, or its %71 encoding)
# get a key; an empty key is never limited, so plain browsing is unaffected.
map $args $pawcycle_search_limit_key {
    "~*(?:^|&)(?:q|%71)=[^&]" $binary_remote_addr;
    default "";
}

# Request correlation: keep a safe inbound X-Request-ID, otherwise use nginx's own id.
map $http_x_request_id $pawcycle_request_id {
    "~^[A-Za-z0-9._-]{1,64}$" $http_x_request_id;
    default $request_id;
}

# JSON access log. $uri has no query string, so values such as a payment key in a
# provider redirect (?paymentKey=...) never reach the log. Every server below
# sets it explicitly, replacing the image's http-level combined log.
log_format pawcycle_json escape=json '{"time":"$time_iso8601","request_id":"$pawcycle_request_id",'
    '"method":"$request_method","uri":"$uri","status":$status,"bytes":$body_bytes_sent,'
    '"request_time":$request_time,"upstream_time":"$upstream_response_time","remote_addr":"$remote_addr"}';

# Re-resolve service addresses after application container replacement.
resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 5s;

upstream pawcycle_application_backend {
    zone pawcycle_application_backend 64k;
    server backend:8080 resolve;
}

upstream pawcycle_application_frontend {
    zone pawcycle_application_frontend 64k;
    server frontend:3000 resolve;
}

server {
    listen 80 default_server;
    server_name _;
    access_log /var/log/nginx/access.log pawcycle_json;

    return 444;
}

server {
    listen 80;
    server_name __PAWCYCLE_DOMAIN__;
    access_log /var/log/nginx/access.log pawcycle_json;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
        default_type text/plain;
    }

    location / {
        return 301 https://__PAWCYCLE_DOMAIN__$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    server_name _;
    access_log /var/log/nginx/access.log pawcycle_json;

    ssl_certificate /etc/letsencrypt/live/pawcycle.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pawcycle.duckdns.org/privkey.pem;
    ssl_reject_handshake on;
}

server {
    listen 443 ssl;
    server_name __PAWCYCLE_DOMAIN__;
    access_log /var/log/nginx/access.log pawcycle_json;

    ssl_certificate /etc/letsencrypt/live/pawcycle.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pawcycle.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 1m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-XSS-Protection;
    proxy_hide_header Referrer-Policy;

    location = /api/auth/login {
        limit_req zone=login_per_ip burst=5 nodelay;
        limit_req_status 429;
        error_page 429 = @login_rate_limited;

        proxy_pass http://pawcycle_application_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $pawcycle_request_id;
        proxy_read_timeout 60s;
    }

    # Anonymous session creation (CSRF bootstrap).
    location = /api/auth/csrf {
        limit_req zone=csrf_per_ip burst=20 nodelay;
        limit_req_status 429;
        error_page 429 = @rate_limited;

        proxy_pass http://pawcycle_application_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $pawcycle_request_id;
        proxy_read_timeout 60s;
    }

    # Product list: only searches (q present) are keyed, see the map above.
    location = /api/products {
        limit_req zone=search_per_ip burst=30 nodelay;
        limit_req_status 429;
        error_page 429 = @rate_limited;

        proxy_pass http://pawcycle_application_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $pawcycle_request_id;
        proxy_read_timeout 60s;
    }

    location = /api/checkout {
        limit_req zone=checkout_per_ip burst=10 nodelay;
        limit_req_status 429;
        error_page 429 = @rate_limited;

        proxy_pass http://pawcycle_application_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $pawcycle_request_id;
        proxy_read_timeout 60s;
    }

    # Toss payment confirm and billing-key prepare/complete share one budget.
    location = /api/payments/toss/confirm {
        limit_req zone=payment_per_ip burst=10 nodelay;
        limit_req_status 429;
        error_page 429 = @rate_limited;

        proxy_pass http://pawcycle_application_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $pawcycle_request_id;
        proxy_read_timeout 60s;
    }

    location ~ ^/api/payment-methods/toss/billing/(?:prepare|complete)$ {
        limit_req zone=payment_per_ip burst=10 nodelay;
        limit_req_status 429;
        error_page 429 = @rate_limited;

        proxy_pass http://pawcycle_application_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $pawcycle_request_id;
        proxy_read_timeout 60s;
    }

    location = /api/interactions {
        limit_req zone=interaction_per_ip burst=60 nodelay;
        limit_req_status 429;
        error_page 429 = @rate_limited;

        proxy_pass http://pawcycle_application_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $pawcycle_request_id;
        proxy_read_timeout 60s;
    }

    # Endpoints that call an LLM when their feature flag is on: product
    # comparison, review summary and personalized recommendations.
    location = /api/products/compare {
        limit_req zone=ai_per_ip burst=30 nodelay;
        limit_req_status 429;
        error_page 429 = @rate_limited;

        proxy_pass http://pawcycle_application_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $pawcycle_request_id;
        proxy_read_timeout 60s;
    }

    location ~ ^/api/products/[^/]+/reviews/summary$ {
        limit_req zone=ai_per_ip burst=30 nodelay;
        limit_req_status 429;
        error_page 429 = @rate_limited;

        proxy_pass http://pawcycle_application_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $pawcycle_request_id;
        proxy_read_timeout 60s;
    }

    location = /api/recommendations/products {
        limit_req zone=ai_per_ip burst=30 nodelay;
        limit_req_status 429;
        error_page 429 = @rate_limited;

        proxy_pass http://pawcycle_application_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $pawcycle_request_id;
        proxy_read_timeout 60s;
    }

    location /api/ {
        proxy_pass http://pawcycle_application_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $pawcycle_request_id;
        proxy_read_timeout 60s;
    }

    location @login_rate_limited {
        default_type application/json;
        return 429 '{"code":"RATE_LIMITED","message":"로그인 요청이 너무 많습니다. 잠시 후 다시 시도해 주세요.","fieldErrors":[]}';
    }

    location @rate_limited {
        default_type application/json;
        return 429 '{"code":"RATE_LIMITED","message":"요청이 너무 많습니다. 잠시 후 다시 시도해 주세요.","fieldErrors":[]}';
    }

    location / {
        proxy_pass http://pawcycle_application_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $pawcycle_request_id;
        proxy_read_timeout 60s;
    }
}

# Container-only health and release smoke endpoint. It deliberately bypasses
# the public redirect so deploy and rollback validation cannot accept a 301.
# It has no request limits: it is never published to the host.
server {
    listen 8081;
    server_name _;
    access_log /var/log/nginx/access.log pawcycle_json;

    client_max_body_size 1m;

    location /api/ {
        proxy_pass http://pawcycle_application_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $pawcycle_request_id;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://pawcycle_application_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $pawcycle_request_id;
        proxy_read_timeout 60s;
    }
}
