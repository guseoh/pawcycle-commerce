# Request correlation: keep a safe inbound X-Request-ID, otherwise use nginx's own id.
map $http_x_request_id $pawcycle_request_id {
    "~^[A-Za-z0-9._-]{1,64}$" $http_x_request_id;
    default $request_id;
}

# JSON access log. $uri has no query string, so values such as a payment key in a
# provider redirect (?paymentKey=...) never reach the log.
log_format pawcycle_json escape=json '{"time":"$time_iso8601","request_id":"$pawcycle_request_id",'
    '"method":"$request_method","uri":"$uri","status":$status,"bytes":$body_bytes_sent,'
    '"request_time":$request_time,"upstream_time":"$upstream_response_time","remote_addr":"$remote_addr"}';

server {
    listen 80;
    server_name _;
    access_log /var/log/nginx/access.log pawcycle_json;

    client_max_body_size 1m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
        default_type text/plain;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $pawcycle_request_id;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $pawcycle_request_id;
        proxy_read_timeout 60s;
    }
}

# Container-only health and release smoke endpoint. This listener is never
# published to the host and remains HTTP in both bootstrap and HTTPS modes.
server {
    listen 8081;
    server_name _;
    access_log /var/log/nginx/access.log pawcycle_json;

    client_max_body_size 1m;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $pawcycle_request_id;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $pawcycle_request_id;
        proxy_read_timeout 60s;
    }
}
