# Test-only overlay. This file is never part of the active Production Compose contract.

services:
  backend:
    networks:
      - test-database

  mysql:
    image: mysql:8.4.10@sha256:c592c15aaf4a1961e15d82eb31ea5987dda862d1c4b1e93424438c0e91dc1f8d
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    env_file:
      - ${PAWCYCLE_TEST_MYSQL_ENV_FILE:?PAWCYCLE_TEST_MYSQL_ENV_FILE is required}
    healthcheck:
      test:
        - CMD-SHELL
        - MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP --host=127.0.0.1 --user="$${MYSQL_USER}" --database="$${MYSQL_DATABASE}" --batch --skip-column-names --execute="SELECT 1" >/dev/null
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped
    stop_grace_period: 60s
    networks:
      - test-database
    mem_limit: 640m
    cpus: 0.70
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  test-database:
    name: ${PAWCYCLE_TEST_DATABASE_NETWORK:?PAWCYCLE_TEST_DATABASE_NETWORK is required}
    internal: true
