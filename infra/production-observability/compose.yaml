name: pawcycle-production-observability

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  prometheus:
    image: prom/prometheus:v3.13.2@sha256:508729e0e2d18e11fd742a5a5ca70e557b940a93948c3c95fd0123a6fd538b69
    entrypoint: ["sh", "-ec"]
    command:
      - >-
        sed "s|__PAWCYCLE_METRICS_TARGET__|$${PAWCYCLE_METRICS_TARGET}|g" /etc/prometheus/prometheus.yml.tpl
        > /etc/prometheus-runtime/prometheus.yml && exec /bin/prometheus
        --config.file=/etc/prometheus-runtime/prometheus.yml
        --storage.tsdb.path=/prometheus
        --storage.tsdb.retention.time=7d
        --storage.tsdb.retention.size=5GB
    environment:
      PAWCYCLE_METRICS_TARGET: ${PAWCYCLE_METRICS_TARGET:?PAWCYCLE_METRICS_TARGET is required}
    ports:
      - "127.0.0.1:${PAWCYCLE_OBSERVABILITY_PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml.tpl:/etc/prometheus/prometheus.yml.tpl:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    networks:
      - app
      - observability
    tmpfs:
      - /etc/prometheus-runtime:size=1m,mode=1777
    restart: unless-stopped
    mem_limit: 384m
    cpus: 0.25
    pids_limit: 128
    logging: *default-logging

  grafana:
    image: grafana/grafana:13.1.3@sha256:ab5cb380e3ff3172d6c8bd2e7cfd31cce977d2881b260e1f5bc089bf0b759b43
    environment:
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_USER__FILE: /run/pawcycle-secrets/grafana-admin-user
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/pawcycle-secrets/grafana-admin-password
      GF_USERS_ALLOW_SIGN_UP: "false"
    depends_on:
      prometheus:
        condition: service_started
    ports:
      - "127.0.0.1:${PAWCYCLE_OBSERVABILITY_GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ${PAWCYCLE_GRAFANA_ADMIN_USER_FILE:?PAWCYCLE_GRAFANA_ADMIN_USER_FILE is required}:/run/pawcycle-secrets/grafana-admin-user:ro
      - ${PAWCYCLE_GRAFANA_ADMIN_PASSWORD_FILE:?PAWCYCLE_GRAFANA_ADMIN_PASSWORD_FILE is required}:/run/pawcycle-secrets/grafana-admin-password:ro
      - grafana-data:/var/lib/grafana
    networks:
      - observability
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.15
    pids_limit: 128
    logging: *default-logging

  # ARCH-016: alert delivery to the production Discord channel. No host port: Prometheus reaches it on the
  # observability bridge and operators use amtool through docker exec. Not attached to the Application network.
  # Caps: the disposable delivery run (validate-observability.sh) sampled 19.3 MiB with alerts firing and
  # resolving, so 64m leaves over 3x headroom; 0.05 CPU matches metrics-proxy, the other mostly idle sidecar.
  # Re-evaluated by the ARCH-012 OFF/ON calibration after the real apply (ARCH-016).
  alertmanager:
    image: prom/alertmanager:v0.28.1@sha256:27c475db5fb156cab31d5c18a4251ac7ed567746a2483ff264516437a39b15ba
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --data.retention=120h
      # Single instance: no gossip listener.
      - --cluster.listen-address=
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./alertmanager/templates:/etc/alertmanager/templates:ro
      - ${PAWCYCLE_ALERTMANAGER_DISCORD_WEBHOOK_FILE:?PAWCYCLE_ALERTMANAGER_DISCORD_WEBHOOK_FILE is required}:/run/pawcycle-secrets/discord-webhook:ro
      # Silences and the notification log survive a restart, so a restart neither drops silences nor re-sends.
      - alertmanager-data:/alertmanager
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --output-document=/dev/null
        - http://127.0.0.1:9093/-/ready
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - observability
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    cpus: 0.05
    pids_limit: 64
    logging: *default-logging

volumes:
  prometheus-data:
    name: ${PAWCYCLE_OBSERVABILITY_PROMETHEUS_VOLUME:-pawcycle-production-observability-prometheus-data}
  grafana-data:
    name: ${PAWCYCLE_OBSERVABILITY_GRAFANA_VOLUME:-pawcycle-production-observability-grafana-data}
  alertmanager-data:
    name: ${PAWCYCLE_OBSERVABILITY_ALERTMANAGER_VOLUME:-pawcycle-production-observability-alertmanager-data}

networks:
  app:
    name: ${PAWCYCLE_APP_NETWORK:-pawcycle-production-app}
    external: true
  observability:
    driver: bridge
