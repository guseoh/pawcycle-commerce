name: pawcycle-production-session-redis

# AUTH-005 session store. Sibling of the Application project (ARCH-012 pattern):
# the release tool never starts, stops or recreates this project, and fences it
# with Host.siblings(). Only the internal Application network can reach it.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  session-redis:
    image: redis:8.10.0-alpine3.23@sha256:978f0e01593e65eed801f2402944efcd936d43b5027e4908a7897baf88ed6241
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --save
      - ""
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - noeviction
    volumes:
      - session-redis-data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    security_opt:
      - no-new-privileges:true
    networks:
      app:
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
    logging: *default-logging

volumes:
  session-redis-data:
    name: ${PAWCYCLE_SESSION_REDIS_VOLUME:-pawcycle-production-session-redis-data}

networks:
  app:
    name: ${PAWCYCLE_APP_NETWORK:-pawcycle-production-app}
    external: true
