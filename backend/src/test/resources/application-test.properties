server.servlet.session.cookie.secure=false
# Background metric refreshes run SQL on their own threads; tests that count Hibernate statements
# (generate_statistics) must not see them. Tests that check a refresh call it directly.
pawcycle.metrics.refresh.initial-delay-ms=86400000
# Tests read text logs (some also activate local-integration, which defaults to JSON).
PAWCYCLE_LOG_FORMAT=
# The membership re-evaluation job would evaluate and delete requests that tests assert on.
# Tests that need it call MembershipReevaluationService.processDue directly.
pawcycle.membership.reevaluation.initial-delay-ms=86400000
