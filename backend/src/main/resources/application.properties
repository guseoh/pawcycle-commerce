spring.application.name=pawcycle-backend
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.sql.init.mode=never
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.path=/
server.servlet.session.timeout=30m
management.endpoints.access.default=none
management.endpoint.health.access=read-only
management.endpoint.prometheus.access=read-only
management.endpoints.web.exposure.include=health,prometheus
management.endpoints.web.discovery.enabled=false
management.endpoints.jmx.exposure.exclude=*
management.endpoint.health.show-details=never
management.health.redis.enabled=${PAWCYCLE_PRODUCT_LIST_CACHE_ENABLED:false}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
pawcycle.catalog.product-list-cache.enabled=${PAWCYCLE_PRODUCT_LIST_CACHE_ENABLED:false}
pawcycle.catalog.product-list-cache.ttl=${PAWCYCLE_PRODUCT_LIST_CACHE_TTL:PT5M}
spring.data.redis.host=${PAWCYCLE_REDIS_HOST:127.0.0.1}
spring.data.redis.port=${PAWCYCLE_REDIS_PORT:6379}
spring.data.redis.connect-timeout=${PAWCYCLE_REDIS_CONNECT_TIMEOUT:500ms}
spring.data.redis.timeout=${PAWCYCLE_REDIS_COMMAND_TIMEOUT:500ms}
pawcycle.commerce.return-request-days=7
pawcycle.commerce.operations.refresh-ms=60000
pawcycle.commerce.billing.enabled=false
spring.ai.model.chat=${SPRING_AI_MODEL_CHAT:none}
spring.ai.retry.max-attempts=1
pawcycle.recommendation.ai.enabled=${PAWCYCLE_RECOMMENDATION_AI_ENABLED:false}
