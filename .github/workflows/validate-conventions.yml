name: Repository Validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: repository-validation-code-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  conventions:
    name: Commit and PR conventions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: sh scripts/validate-commit-message.sh --message "$PR_TITLE"

      - name: Validate PR body encoding
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$PR_BODY" | python scripts/validate-pr-body-encoding.py --from-stdin

      - name: Validate task artifacts
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s\n\n%s\n' "$PR_TITLE" "$PR_BODY" | python scripts/validate-task-artifacts.py --from-stdin

      - name: Validate commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          failed=0
          merge_base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          for sha in $(git rev-list --no-merges "$merge_base..$HEAD_SHA"); do
            subject="$(git log -1 --format=%s "$sha")"
            echo "검증 중: ${sha} ${subject}"
            if ! sh scripts/validate-commit-message.sh --message "$subject"; then
              echo "::error title=Invalid commit message::${sha} ${subject}"
              failed=1
            fi
          done
          exit "$failed"

      - name: Check whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          merge_base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          git diff --check "$merge_base..$HEAD_SHA"

  classify:
    name: Classify validation changes
    needs: conventions
    runs-on: ubuntu-latest
    outputs:
      harness: ${{ steps.paths.outputs.harness }}
      backend: ${{ steps.paths.outputs.backend }}
      frontend: ${{ steps.paths.outputs.frontend }}
      production: ${{ steps.paths.outputs.production }}
    steps:
      - name: Checkout pull request
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify pull request diff
        id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          merge_base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          git diff --no-renames --name-only "$merge_base..$HEAD_SHA" \
            | python scripts/classify-validation-changes.py \
            | tee -a "$GITHUB_OUTPUT"

  harness:
    name: Harness validation
    if: needs.classify.outputs.harness == 'true'
    needs: [conventions, classify]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Compile Harness Python
        run: |
          python -m py_compile \
            scripts/validate-task-artifacts.py \
            scripts/validate-pr-body-encoding.py \
            scripts/classify-validation-changes.py \
            scripts/run-agent-benchmark.py \
            scripts/validate-agent-benchmark.py \
            scripts/render-agent-benchmark-charts.py \
            .github/scripts/collect-discord-context.py

      - name: Run Harness regressions
        run: |
          python -m unittest \
            scripts.test_validate_task_artifacts \
            scripts.test_validate_pr_body_encoding \
            scripts.test_validate_conventions_workflow \
            scripts.test_agent_benchmark_tools \
            scripts.test_discord_context \
            scripts.test_discord_payload \
            scripts.test_send_discord_notification
          python scripts/validate-discord-payloads.py
          python scripts/validate-obsidian-record.py

  backend:
    name: Backend and MySQL validation
    if: needs.classify.outputs.backend == 'true'
    needs: [conventions, classify]
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: pawcycle_test
          MYSQL_USER: pawcycle_ci
          MYSQL_PASSWORD: ci-only-not-a-secret
          MYSQL_ROOT_PASSWORD: ci-only-root-not-a-secret
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=20s
    steps:
      - name: Checkout pull request
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Verify MySQL service
        env:
          MYSQL_CONTAINER_ID: ${{ job.services.mysql.id }}
          MYSQL_DATABASE: pawcycle_test
          MYSQL_USERNAME: pawcycle_ci
          MYSQL_PASSWORD: ci-only-not-a-secret
          MYSQL_PORT: ${{ job.services.mysql.ports['3306'] }}
        run: |
          test -n "$MYSQL_CONTAINER_ID"
          test -n "$MYSQL_PORT"
          service_info="$(docker exec --env MYSQL_PWD="$MYSQL_PASSWORD" "$MYSQL_CONTAINER_ID" mysql --batch --skip-column-names --user="$MYSQL_USERNAME" "$MYSQL_DATABASE" --execute="SELECT CONCAT(@@version, '|', @@character_set_server, '|', @@collation_server);")"
          IFS='|' read -r mysql_version character_set collation <<< "$service_info"
          case "$mysql_version" in
            8.4.*) ;;
            *)
              echo "::error title=Unexpected MySQL version::${mysql_version}"
              exit 1
              ;;
          esac
          if [ "$character_set" != "utf8mb4" ]; then
            echo "::error title=Unexpected MySQL character set::${character_set}"
            exit 1
          fi
          if [ "$collation" != "utf8mb4_0900_ai_ci" ]; then
            echo "::error title=Unexpected MySQL collation::${collation}"
            exit 1
          fi

      - name: Set up Java 25
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
          cache-dependency-path: |
            backend/*.gradle*
            backend/gradle/wrapper/gradle-wrapper.properties

      - name: Prepare Gradle wrapper
        working-directory: backend
        run: chmod +x ./gradlew

      - name: Backend test
        working-directory: backend
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:${{ job.services.mysql.ports['3306'] }}/pawcycle_test
          SPRING_DATASOURCE_USERNAME: pawcycle_ci
          SPRING_DATASOURCE_PASSWORD: ci-only-not-a-secret
        run: ./gradlew test

      - name: Backend build without repeated tests
        working-directory: backend
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:${{ job.services.mysql.ports['3306'] }}/pawcycle_test
          SPRING_DATASOURCE_USERNAME: pawcycle_ci
          SPRING_DATASOURCE_PASSWORD: ci-only-not-a-secret
        run: ./gradlew build -x test

  frontend:
    name: Frontend validation
    if: needs.classify.outputs.frontend == 'true'
    needs: [conventions, classify]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend install
        working-directory: frontend
        run: npm ci

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend build
        working-directory: frontend
        run: npm run build

  production:
    name: Production contract validation (${{ matrix.lane }})
    if: needs.classify.outputs.production == 'true'
    needs: [conventions, classify]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lane: [contracts, compose, recovery, auth-lifecycle]
    steps:
      - name: Checkout pull request
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Set up QEMU for ARM64 image validation
        if: matrix.lane == 'contracts'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130

      - name: Set up Docker Buildx for ARM64 image validation
        if: matrix.lane == 'contracts'
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435

      - name: Validate production deployment and recovery contracts
        if: matrix.lane == 'contracts'
        run: |
          bash -n \
            infra/production/release-common.sh \
            infra/production/materialize-runtime-env.sh \
            infra/production/production-command-dispatch.sh \
            infra/production/invoke-oci-production-command.sh \
            infra/production/oci-db-backup-restore.sh \
            infra/production/materialize-ssm-env.sh \
            infra/production/rds-read-only-preflight.sh \
            infra/production/rds-transition-gate.sh \
            infra/production/deploy.sh \
            infra/production/rollback.sh \
            infra/production/subscription-automation-control.sh \
            infra/production/subscription-automation-preflight.sh \
            infra/production/production-db-restore.sh \
            infra/production/https.sh \
            infra/production/db-backup-restore.sh \
            infra/production/ec2-status-check-alarm-common.sh \
            infra/production/create-ec2-status-check-alarm.sh \
            infra/production/cleanup-ec2-status-check-alarm.sh \
            infra/production/test-ec2-status-check-alarm.sh \
            infra/production/verify-production-auth-session-smoke.sh \
            infra/production/test-production-auth-session-smoke.sh \
            infra/production/create-production-auth-smoke-member.sh \
            infra/production/test-create-production-auth-smoke-member-lifecycle.sh \
            infra/production/import-demo-catalog.sh \
            infra/production/test-demo-catalog-import.sh \
            infra/production/test-production-scripts.sh \
            infra/production/test-materialize-runtime-env.sh \
            infra/production/test-production-command-dispatch.sh \
            infra/production/test-invoke-oci-production-command.sh \
            infra/production/test-oci-db-backup-restore.sh \
            infra/production/test-rollback-control-compatibility.sh \
            infra/production/test-production-nginx.sh \
            infra/production/test-production-compose.sh \
            infra/production/test-rds-readiness.sh \
            infra/production/diagnose-backend-state.sh \
            infra/production/test-diagnose-backend-state.sh \
            infra/production/test-subscription-automation-preflight-datasource.sh \
            infra/production/test-db-backup-restore.sh \
            infra/production-metrics-proxy/test-metrics-proxy.sh
          bash -n infra/production-observability/validate-observability.sh
          python -m py_compile infra/production/validate-production-contracts.py
          python infra/production/validate-production-contracts.py
          python infra/production/validate-production-ssm-document.py
          bash infra/production/test-production-scripts.sh
          bash infra/production/test-materialize-runtime-env.sh
          bash infra/production/test-production-command-dispatch.sh
          bash infra/production/test-invoke-oci-production-command.sh
          bash infra/production/test-oci-db-backup-restore.sh
          bash infra/production/test-subscription-automation-preflight-datasource.sh
          bash infra/production/test-demo-catalog-import.sh
          bash infra/production/test-rollback-control-compatibility.sh
          bash infra/production/test-production-nginx.sh
          bash infra/production/test-production-arm64-images.sh
          bash infra/production/test-ec2-status-check-alarm.sh
          bash infra/production/test-production-auth-session-smoke.sh
          bash infra/production/test-diagnose-backend-state.sh
          python -m py_compile infra/production/test-create-production-auth-smoke-member.py
          sudo "$(command -v python)" infra/production/test-create-production-auth-smoke-member.py
          bash infra/production-observability/validate-observability.sh
          bash infra/production-metrics-proxy/test-metrics-proxy.sh

      - name: Validate production Compose lifecycle
        if: matrix.lane == 'compose'
        run: bash infra/production/test-production-compose.sh

      - name: Validate production backup and restore lifecycle
        if: matrix.lane == 'recovery'
        run: bash infra/production/test-oci-db-backup-restore.sh

      - name: Validate production auth smoke member lifecycle
        if: matrix.lane == 'auth-lifecycle'
        run: bash infra/production/test-create-production-auth-smoke-member-lifecycle.sh

  application:
    name: Application validation
    if: always()
    needs: [conventions, classify, harness, backend, frontend, production]
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate component results
        env:
          CONVENTIONS_RESULT: ${{ needs.conventions.result }}
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          HARNESS_ENABLED: ${{ needs.classify.outputs.harness }}
          HARNESS_RESULT: ${{ needs.harness.result }}
          BACKEND_ENABLED: ${{ needs.classify.outputs.backend }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_ENABLED: ${{ needs.classify.outputs.frontend }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          PRODUCTION_ENABLED: ${{ needs.classify.outputs.production }}
          PRODUCTION_RESULT: ${{ needs.production.result }}
        run: |
          require_success() {
            name="$1"
            result="$2"
            if [ "$result" != "success" ]; then
              echo "::error title=Required validation did not succeed::${name}=${result}"
              exit 1
            fi
          }

          require_component_result() {
            name="$1"
            enabled="$2"
            result="$3"
            if [ "$enabled" = "true" ] && [ "$result" != "success" ]; then
              echo "::error title=Selected component did not succeed::${name}=${result}"
              exit 1
            fi
            if [ "$enabled" = "false" ] && [ "$result" != "skipped" ]; then
              echo "::error title=Unselected component was not skipped::${name}=${result}"
              exit 1
            fi
            if [ "$enabled" != "true" ] && [ "$enabled" != "false" ]; then
              echo "::error title=Invalid classifier output::${name}=${enabled}"
              exit 1
            fi
          }

          require_success conventions "$CONVENTIONS_RESULT"
          require_success classify "$CLASSIFY_RESULT"
          require_component_result harness "$HARNESS_ENABLED" "$HARNESS_RESULT"
          require_component_result backend "$BACKEND_ENABLED" "$BACKEND_RESULT"
          require_component_result frontend "$FRONTEND_ENABLED" "$FRONTEND_RESULT"
          require_component_result production "$PRODUCTION_ENABLED" "$PRODUCTION_RESULT"
