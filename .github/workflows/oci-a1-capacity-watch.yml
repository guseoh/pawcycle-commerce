name: OCI Tokyo A1 Capacity Watch

on:
  pull_request:
    paths:
      - ".github/workflows/oci-a1-capacity-watch.yml"
      - ".github/scripts/oci_a1_capacity_monitor.py"
      - ".github/scripts/test_oci_a1_capacity_monitor.py"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "self_test checks offline logic; check queries OCI once"
        required: true
        default: self_test
        type: choice
        options:
          - self_test
          - check

permissions:
  contents: read

concurrency:
  group: oci-a1-capacity-watch-${{ github.event.pull_request.number || 'scheduled' }}
  cancel-in-progress: false

jobs:
  offline-tests:
    if: github.event_name != 'schedule' || vars.OCI_A1_MONITOR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Configure Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Offline tests (no OCI calls, no credentials)
        run: python -m unittest discover -s .github/scripts -p 'test_oci_a1_capacity_monitor.py' -v

  monitor:
    needs: offline-tests
    if: (github.event_name == 'schedule' && vars.OCI_A1_MONITOR_ENABLED == 'true') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'check')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout trusted repository code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Configure Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install pinned OCI Python SDK
        run: python -m pip install --disable-pip-version-check 'oci==2.185.0'

      - name: Read OCI capacity report and notify by GitHub Issue
        env:
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_API_FINGERPRINT: ${{ secrets.OCI_API_FINGERPRINT }}
          OCI_API_PRIVATE_KEY: ${{ secrets.OCI_API_PRIVATE_KEY }}
          OCI_API_PASSPHRASE: ${{ secrets.OCI_API_PASSPHRASE }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/scripts/oci_a1_capacity_monitor.py
