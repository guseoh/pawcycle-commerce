name: OCI A1 Monitor Health

on:
  pull_request:
    paths:
      - ".github/workflows/oci-a1-monitor-health.yml"
      - ".github/scripts/oci_a1_monitor_health.py"
      - ".github/scripts/test_oci_a1_monitor_health.py"
      - ".github/scripts/oci_a1_capacity_monitor.py"
      - "docs/runbook/oci-a1-capacity-watch.md"
  workflow_run:
    workflows: ["OCI Tokyo A1 Capacity Watch"]
    types: [completed]
  schedule:
    # Independent 2-hour watchdog: catches stale or failed capacity checks.
    - cron: "43 */2 * * *"
    # Daily status message at approximately 09:47 KST (00:47 UTC).
    - cron: "47 0 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "self_test is offline; preview reads run history without sending"
        type: choice
        required: true
        default: self_test
        options:
          - self_test
          - preview

permissions:
  contents: read

concurrency:
  group: oci-a1-monitor-health
  cancel-in-progress: false

jobs:
  offline-tests:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'self_test')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted repository code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Configure Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Offline OCI monitor and health tests
        run: python -m unittest discover -s .github/scripts -p 'test_oci_a1*.py' -v

  health:
    if: >-
      (github.event_name == 'schedule' && vars.OCI_A1_MONITOR_ENABLED == 'true') ||
      (github.event_name == 'workflow_run' && vars.OCI_A1_MONITOR_ENABLED == 'true' &&
       github.event.workflow_run.event == 'schedule' && github.event.workflow_run.head_branch == 'main') ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'preview')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: write
    env:
      OCI_A1_HEALTH_MODE: >-
        ${{ github.event_name == 'workflow_dispatch' && 'preview' ||
            (github.event_name == 'schedule' && github.event.schedule == '47 0 * * *' && 'daily' || 'watch') }}
      GITHUB_TOKEN: ${{ github.token }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
      OCI_API_FINGERPRINT: ${{ secrets.OCI_API_FINGERPRINT }}
      OCI_API_PRIVATE_KEY: ${{ secrets.OCI_API_PRIVATE_KEY }}
      OCI_API_PASSPHRASE: ${{ secrets.OCI_API_PASSPHRASE }}
    steps:
      - name: Checkout trusted repository code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Configure Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install pinned OCI SDK only for daily capacity report
        if: env.OCI_A1_HEALTH_MODE == 'daily'
        run: python -m pip install --disable-pip-version-check 'oci==2.185.0'
      - name: Detect missing and failed runs or send daily Discord status
        run: python .github/scripts/oci_a1_monitor_health.py
