name: CodeRabbit Review Handoff

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_dispatch:

concurrency:
  group: coderabbit-review-handoff-${{ github.event.pull_request.number || 'manual' }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  review-handoff:
    name: Remind CodeRabbit manual review
    if: github.repository == 'guseoh/pawcycle-commerce'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted main Harness
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          persist-credentials: false

      - name: Manage review handoff for review-ready PRs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/request_coderabbit_review.py
