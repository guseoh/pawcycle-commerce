# Temporary read-only one-shot OCI/Discord verification; remove after successful test.
name: OCI A1 One-shot Live Smoke

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  smoke:
    if: >-
      github.repository == 'guseoh/pawcycle-commerce' &&
      github.event.issue.number == 384 &&
      github.event.issue.pull_request != null &&
      github.event.comment.user.login == 'guseoh' &&
      github.event.comment.body == '/oci-a1-monitor-live-smoke-20261016' &&
      vars.OCI_A1_MONITOR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted main branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install pinned OCI Python SDK
        run: python -m pip install --disable-pip-version-check 'oci==2.185.0'
      - name: Query OCI once and send explicitly labeled Discord TEST report
        env:
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_API_FINGERPRINT: ${{ secrets.OCI_API_FINGERPRINT }}
          OCI_API_PRIVATE_KEY: ${{ secrets.OCI_API_PRIVATE_KEY }}
          OCI_API_PASSPHRASE: ${{ secrets.OCI_API_PASSPHRASE }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python - <<'PY'
          import os
          import sys
          from datetime import datetime, timezone

          sys.path.insert(0, ".github/scripts")
          from oci_a1_capacity_monitor import fetch_capacity
          from oci_a1_monitor_health import discord_payload, post_discord

          status, count = fetch_capacity()
          observed = datetime.now(timezone.utc)
          run_url = ("https://github.com/guseoh/pawcycle-commerce/actions/runs/" +
                     os.environ["GITHUB_RUN_ID"])
          payload = discord_payload(
              "TEST ONLY: OCI Tokyo A1 Capacity Monitor",
              "Requested one-time live test. This is NOT an AVAILABLE alert. "
              "No VM was created/retried; report is point-in-time only.",
              [
                  ("Live OCI Capacity Report status", status),
                  ("Shape", "VM.Standard.A1.Flex · 2 OCPU / 12 GB"),
                  ("Region / AD", "ap-tokyo-1 · nREs:AP-TOKYO-1-AD-1"),
                  ("Available count", "not provided" if count is None else str(count)),
              ],
              run_url,
              observed,
          )
          print("OCI live Capacity Report: status=" + status +
                " count=" + str(count))
          post_discord(payload)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as file:
              file.write("## One-time OCI A1 + Discord TEST\n\n")
              file.write("- OCI status: " + status + "\n")
              file.write("- Available count: " + str(count) + "\n")
              file.write("- Discord TEST message delivered.\n")
              file.write("- No OCI instance or resource created/retried.\n")
          PY
