name: Production Release Readiness

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Lowercase 40-character commit SHA to verify
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-release-readiness-${{ github.ref_name }}-${{ inputs.target_sha }}
  cancel-in-progress: false

jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - name: Validate workflow ref
        env:
          WORKFLOW_REF: ${{ github.ref }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "$WORKFLOW_REF" != "refs/heads/main" ]; then
            echo "Production release readiness must run from main." >&2
            exit 1
          fi

      - name: Checkout main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Validate target commit
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "target_sha must be exactly 40 lowercase hexadecimal characters" >&2
            exit 1
          fi

          if ! git cat-file -e "${TARGET_SHA}^{commit}"; then
            echo "target_sha does not identify an existing commit" >&2
            exit 1
          fi

          if ! git merge-base --is-ancestor "$TARGET_SHA" HEAD; then
            echo "target_sha is not contained in main" >&2
            exit 1
          fi

      - name: Verify release images
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail

          docker manifest inspect "ghcr.io/${GITHUB_REPOSITORY}-backend:${TARGET_SHA}"
          docker manifest inspect "ghcr.io/${GITHUB_REPOSITORY}-frontend:${TARGET_SHA}"

      - name: Write readiness summary
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "## Production release readiness"
            echo
            echo "- Target SHA: \`$TARGET_SHA\`"
            echo "- Backend image: ready"
            echo "- Frontend image: ready"
            echo
            echo "Readiness verification is not a deployment success signal."
            echo "The existing OPS-010 manual deployment procedure is the next step."
          } >> "$GITHUB_STEP_SUMMARY"
