name: Temporary Next security lockfile regeneration
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - frontend/package.json
      - frontend/package-lock.json
permissions:
  contents: write
jobs:
  regenerate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/fe/next-security-20261031'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - name: Regenerate lockfile from pinned dependencies
        working-directory: frontend
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm pkg get dependencies.next devDependencies.eslint-config-next
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile only if it changed
        run: |
          git add frontend/package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(frontend): refresh security patch lockfile"
          git push origin HEAD:refs/heads/feat/fe/next-security-20261031
