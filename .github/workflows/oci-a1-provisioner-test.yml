name: OCI A1 Provisioner Offline Tests

on:
  pull_request:
    paths:
      - ".github/workflows/oci-a1-provisioner-test.yml"
      - ".github/scripts/oci_a1*.py"
      - ".github/scripts/test_oci_a1*.py"
      - "infra/oci-a1/**"
      - "docs/runbook/oci-a1*.md"

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install the existing pinned SDK for offline model contracts
        run: python -m pip install --disable-pip-version-check 'oci==2.185.0'
      - name: Fake OCI lifecycle and existing hourly monitor regressions
        run: |
          python -c 'import oci; assert oci.__version__ == "2.185.0"'
          python -m unittest discover -s .github/scripts -p 'test_oci_a1*.py' -v
      - name: Real systemd timer stop with fake OCI only
        run: sudo "$(command -v python)" .github/scripts/test_oci_a1_systemd.py -v
