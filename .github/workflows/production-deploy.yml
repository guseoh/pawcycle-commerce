name: Production Deploy
run-name: Production Deploy · ${{ inputs.target_sha }}

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Lowercase 40-character commit SHA to deploy
        required: true
        type: string
      approved_contract_from_sha:
        description: Approved stored Control SHA when the Release contract changes
        required: false
        type: string
      approved_control_sha:
        description: Approved clean detached Control SHA when the Release contract changes
        required: false
        type: string
      approved_migration_target_sha:
        description: Approved target SHA when the Flyway migration bundle changes
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: pawcycle-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Validate workflow ref and target SHA
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
          APPROVED_CONTRACT_FROM_SHA: ${{ inputs.approved_contract_from_sha }}
          APPROVED_CONTROL_SHA: ${{ inputs.approved_control_sha }}
          APPROVED_MIGRATION_TARGET_SHA: ${{ inputs.approved_migration_target_sha }}
          WORKFLOW_REF: ${{ github.ref }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "$WORKFLOW_REF" != "refs/heads/main" ]; then
            echo "Production deploy must run from main." >&2
            exit 1
          fi

          if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "target_sha must be exactly 40 lowercase hexadecimal characters" >&2
            exit 1
          fi

          for approval in APPROVED_CONTRACT_FROM_SHA APPROVED_CONTROL_SHA APPROVED_MIGRATION_TARGET_SHA; do
            value="${!approval}"
            if [[ -n "$value" && ! "$value" =~ ^[0-9a-f]{40}$ ]]; then
              echo "${approval,,} must be empty or exactly 40 lowercase hexadecimal characters" >&2
              exit 1
            fi
          done

      - name: Checkout main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Verify target commit and production images
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail

          git cat-file -e "${TARGET_SHA}^{commit}"
          git merge-base --is-ancestor "$TARGET_SHA" HEAD
          docker buildx imagetools inspect "ghcr.io/${GITHUB_REPOSITORY}-backend:${TARGET_SHA}" >/dev/null
          docker buildx imagetools inspect "ghcr.io/${GITHUB_REPOSITORY}-frontend:${TARGET_SHA}" >/dev/null

      - name: Validate production environment contract
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_PRODUCTION_DEPLOY_ROLE_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          SSM_DOCUMENT_NAME: ${{ vars.PAWCYCLE_PRODUCTION_SSM_DOCUMENT_NAME }}
          SSM_DOCUMENT_VERSION: ${{ vars.PAWCYCLE_PRODUCTION_SSM_DOCUMENT_VERSION }}
          SSM_TARGET_TAG_KEY: ${{ vars.PAWCYCLE_PRODUCTION_SSM_TARGET_TAG_KEY }}
          SSM_TARGET_TAG_VALUE: ${{ vars.PAWCYCLE_PRODUCTION_SSM_TARGET_TAG_VALUE }}
        shell: bash
        run: |
          set -euo pipefail

          for required in AWS_ROLE_ARN AWS_REGION SSM_DOCUMENT_NAME SSM_DOCUMENT_VERSION SSM_TARGET_TAG_KEY SSM_TARGET_TAG_VALUE; do
            if [ -z "${!required:-}" ]; then
              echo "production environment variable is required: $required" >&2
              exit 1
            fi
          done
          if [[ ! "$SSM_DOCUMENT_VERSION" =~ ^[1-9][0-9]*$ ]]; then
            echo "SSM document version must be a positive immutable numeric version" >&2
            exit 1
          fi

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@acca2b1b2070338fb9fd1ca27ecee81d687e58e5
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_PRODUCTION_DEPLOY_ROLE_ARN }}
          role-session-name: pawcycle-production-deploy-${{ github.run_id }}
          role-duration-seconds: 3600
          mask-aws-account-id: true

      - name: Resolve single Production SSM target
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          SSM_TARGET_TAG_KEY: ${{ vars.PAWCYCLE_PRODUCTION_SSM_TARGET_TAG_KEY }}
          SSM_TARGET_TAG_VALUE: ${{ vars.PAWCYCLE_PRODUCTION_SSM_TARGET_TAG_VALUE }}
        shell: bash
        run: |
          set -euo pipefail

          target_json="$(aws ssm describe-instance-information \
            --region "$AWS_REGION" \
            --filters "Key=tag:${SSM_TARGET_TAG_KEY},Values=${SSM_TARGET_TAG_VALUE}" \
            --query 'InstanceInformationList[].{InstanceId:InstanceId,PingStatus:PingStatus,ResourceType:ResourceType}' \
            --output json)"
          target_count="$(jq 'length' <<<"$target_json")"
          if [ "$target_count" -ne 1 ]; then
            echo "Production SSM target tag must resolve to exactly one managed node" >&2
            exit 1
          fi

          instance_id="$(jq -r '.[0].InstanceId // empty' <<<"$target_json")"
          ping_status="$(jq -r '.[0].PingStatus // empty' <<<"$target_json")"
          resource_type="$(jq -r '.[0].ResourceType // empty' <<<"$target_json")"
          if [[ ! "$instance_id" =~ ^i-[0-9a-f]{8}([0-9a-f]{9})?$ ]]; then
            echo "resolved Production target is not an EC2 instance ID" >&2
            exit 1
          fi
          if [ "$ping_status" != "Online" ] || [ "$resource_type" != "EC2Instance" ]; then
            echo "resolved Production target is not an online EC2 managed node" >&2
            exit 1
          fi
          echo "SSM_INSTANCE_ID=$instance_id" >> "$GITHUB_ENV"

      - name: Run restricted Production preflight and deploy documents
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          SSM_DOCUMENT_NAME: ${{ vars.PAWCYCLE_PRODUCTION_SSM_DOCUMENT_NAME }}
          SSM_DOCUMENT_VERSION: ${{ vars.PAWCYCLE_PRODUCTION_SSM_DOCUMENT_VERSION }}
          TARGET_SHA: ${{ inputs.target_sha }}
          APPROVED_CONTRACT_FROM_SHA: ${{ inputs.approved_contract_from_sha }}
          APPROVED_CONTROL_SHA: ${{ inputs.approved_control_sha }}
          APPROVED_MIGRATION_TARGET_SHA: ${{ inputs.approved_migration_target_sha }}
        shell: bash
        run: |
          set -euo pipefail

          print_ssm_plugin_output() {
            local invocations="$1"
            jq -r '.CommandInvocations[0].CommandPlugins[]? | select(.Output? != null and .Output != "") | "SSM plugin output (\(.Name // "unknown")):\n\(.Output)"' \
              <<<"$invocations" | head -c 12000 >&2 || true
          }

          run_ssm_operation() {
            local operation="$1"
            local command_id
            local command_timeout_seconds
            local deadline
            local invocations
            local invocation_count
            local status

            case "$operation" in
              preflight) command_timeout_seconds=900 ;;
              deploy) command_timeout_seconds=1800 ;;
              *) echo "unsupported SSM operation: $operation" >&2; return 1 ;;
            esac

            command_id="$(aws ssm send-command \
              --region "$AWS_REGION" \
              --document-name "$SSM_DOCUMENT_NAME" \
              --document-version "$SSM_DOCUMENT_VERSION" \
              --instance-ids "$SSM_INSTANCE_ID" \
              --parameters "Operation=${operation},TargetSha=${TARGET_SHA},ApprovedContractFromSha=${APPROVED_CONTRACT_FROM_SHA},ApprovedControlSha=${APPROVED_CONTROL_SHA},ApprovedMigrationTargetSha=${APPROVED_MIGRATION_TARGET_SHA}" \
              --comment "PawCycle production ${operation} ${TARGET_SHA}" \
              --timeout-seconds "$command_timeout_seconds" \
              --max-concurrency "1" \
              --max-errors "0" \
              --query "Command.CommandId" \
              --output text)"
            if [ -z "$command_id" ] || [ "$command_id" = "None" ]; then
              echo "SSM ${operation} command ID was not returned" >&2
              return 1
            fi

            deadline=$((SECONDS + command_timeout_seconds + 150))
            while (( SECONDS < deadline )); do
              invocations="$(aws ssm list-command-invocations \
                --region "$AWS_REGION" \
                --command-id "$command_id" \
                --details \
                --output json)"
              invocation_count="$(jq '.CommandInvocations | length' <<<"$invocations")"
              if [ "$invocation_count" -gt 1 ]; then
                echo "SSM ${operation} command returned more than one Production invocation" >&2
                print_ssm_plugin_output "$invocations"
                return 1
              fi
              if [ "$invocation_count" -eq 1 ]; then
                status="$(jq -r '.CommandInvocations[0].Status // empty' <<<"$invocations")"
                case "$status" in
                  Success)
                    echo "SSM ${operation} command: Success"
                    return 0
                    ;;
                  Pending|InProgress|Delayed|Cancelling)
                    ;;
                  *)
                    echo "SSM ${operation} command did not succeed: ${status:-unknown}" >&2
                    print_ssm_plugin_output "$invocations"
                    return 1
                    ;;
                esac
              fi
              sleep 10
            done

            echo "SSM ${operation} command status could not be determined before timeout" >&2
            return 1
          }

          run_ssm_operation preflight
          run_ssm_operation deploy

      - name: Write deployment command summary
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "## Production deploy command"
            echo
            echo "- Target SHA: \`$TARGET_SHA\`"
            echo "- SSM preflight command: Success"
            echo "- SSM deploy command: Success"
          } >> "$GITHUB_STEP_SUMMARY"
