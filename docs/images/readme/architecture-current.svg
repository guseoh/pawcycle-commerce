<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="780" viewBox="0 0 1280 780" role="img" aria-labelledby="title desc">
<title id="title">Current Architecture</title>
<desc id="desc">Repository application and container topology after AWS retirement. Nginx routes to Next.js and Spring Boot. Spring Boot uses MySQL, Redis and external providers. Micrometer metrics feed Prometheus; Grafana queries metrics and Prometheus routes alerts to Alertmanager. GitHub Actions publishes images to GHCR with no runtime deployment connection.</desc>
