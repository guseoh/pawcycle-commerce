<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1020" viewBox="0 0 1280 1020" role="img" aria-labelledby="title desc">
<title id="title">Historical AWS Production Architecture</title>
<desc id="desc">Retired AWS architecture. Route 53 and HTTPS lead to Nginx on Application EC2, which runs Next.js, Spring Boot and Docker MySQL 8.4 with persistent EBS-backed storage. Database backups go to S3. A separate Observability EC2 hosts Prometheus and Grafana and collects Spring Boot metrics through metrics-proxy. Toss Payments and AI Provider are external. GitHub Actions publishes GHCR images for historical Application EC2 deployment.</desc>
